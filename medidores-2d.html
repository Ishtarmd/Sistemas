<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');const W=800,H=460;let C={};
function readColors(){const cs=getComputedStyle(document.documentElement);for(const k of ['bg','ink','muted','line','metal','metalD','fluid','fluidL','fluidD','glass','hot','cold','accent','gas','solid','solidD','sig','warn','panel','hg'])C[k]=cs.getPropertyValue('--cv-'+k).trim();}
function resize(){const r=cv.getBoundingClientRect();const d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*H/W*d);ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);}
const hash=i=>{let x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function hex(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((x,i)=>Math.round(x+(B[i]-x)*t)).join(',')+')'}
function glow(t){const s=[[70,10,5],[190,30,10],[255,110,20],[255,200,90],[255,248,225]];const p=clamp(t,0,1)*(s.length-1),i=Math.min(Math.floor(p),s.length-2),f=p-i;return'rgb('+s[i].map((x,j)=>Math.round(x+(s[i+1][j]-x)*f)).join(',')+')'}
function shade(f,x,y,w,h,round){if(f!==C.metal&&f!==C.metalD&&f!==C.panel)return f;if(f===C.panel)return f;const hi=mix(f,'#ffffff',f===C.metal?0.45:0.3),lo=mix(f,'#000000',0.18);if(round){const gr=ctx.createRadialGradient(x-w*0.35,y-w*0.35,w*0.1,x,y,w);gr.addColorStop(0,hi);gr.addColorStop(1,lo);return gr}const gr=w>h*1.6?ctx.createLinearGradient(x,y,x,y+h):ctx.createLinearGradient(x,y,x+w,y);gr.addColorStop(0,lo);gr.addColorStop(0.35,hi);gr.addColorStop(1,lo);return gr}
function bb(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<p.length;i+=2){a=Math.min(a,p[i]);c=Math.max(c,p[i]);b=Math.min(b,p[i+1]);d=Math.max(d,p[i+1])}return[a,b,c-a,d-b]}
const isMet=f=>f===C.metal||f===C.metalD;
function cylG(cy,hw){const gr=ctx.createLinearGradient(0,cy-hw,0,cy+hw);gr.addColorStop(0,'rgba(0,0,0,.10)');gr.addColorStop(.3,'rgba(255,255,255,.20)');gr.addColorStop(.55,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.14)');return gr}
function soft(on){if(on){ctx.shadowColor='rgba(10,20,30,.22)';ctx.shadowBlur=6;ctx.shadowOffsetY=2}else{ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0}}

// ===== realismo de fluidos: velocidad de fase estimada, estelas, olas, granos =====
const _SP={};function rateOf(key,ph){const now=performance.now()/1000;let e=_SP[key];if(!e){_SP[key]={p:ph,t:now,r:0};return 0}const dt=now-e.t;if(dt>0.004){const r=(ph-e.p)/dt;if(dt<0.6&&isFinite(r))e.r=e.r*0.6+r*0.4;else e.r=0;e.p=ph;e.t=now}return e.r}
const TM=()=>performance.now()/1000;
function streak(xb,yb,x,y,r,col){const L=Math.hypot(x-xb,y-yb);if(L>r*0.8){ctx.globalAlpha=0.32;g.line([xb,yb,x,y],col,r*1.5);ctx.globalAlpha=1}g.circ(x,y,r,col);if(r>=2.2){ctx.globalAlpha=0.55;g.circ(x-r*0.35,y-r*0.35,r*0.38,'#ffffff');ctx.globalAlpha=1}}
const g={
 rect(x,y,w,h,f,s,lw=2,r=0){ctx.beginPath();if(r)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);if(f){const m=isMet(f);if(m)soft(1);ctx.fillStyle=shade(f,x,y,w,h);ctx.fill();if(m)soft(0)}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke()}},
 line(p,s,lw=2,dash){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.setLineDash([])},
 poly(p,f,s,lw=2){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();if(f){const m=isMet(f);if(m)soft(1);const B=bb(p);ctx.fillStyle=shade(f,B[0],B[1],B[2],B[3]);ctx.fill();if(m)soft(0)}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke()}},
 circ(x,y,r,f,s,lw=2){ctx.beginPath();ctx.arc(x,y,Math.max(r,0.1),0,Math.PI*2);if(f){const m=isMet(f)&&r>8;if(m)soft(1);ctx.fillStyle=m?shade(f,x,y,r,r,1):f;ctx.fill();if(m)soft(0)}if(s){ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.stroke()}},
 arc(x,y,r,a0,a1,s,lw=2,ccw){ctx.beginPath();ctx.arc(x,y,r,a0,a1,ccw);ctx.strokeStyle=s;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke()},
 text(t,x,y,o={}){ctx.font=(o.w||500)+' '+(o.s||14)+'px '+(o.f==='m'?'"JetBrains Mono",ui-monospace,monospace':o.f==='d'?'"Saira Condensed","Arial Narrow",sans-serif':'"Source Sans 3",system-ui,sans-serif');ctx.fillStyle=o.c||C.muted;ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'middle';ctx.fillText(t,x,y)},
 arrow(x1,y1,x2,y2,s,lw=2,h=9){const a=Math.atan2(y2-y1,x2-x1);g.line([x1,y1,x2,y2],s,lw);g.poly([x2,y2,x2-h*Math.cos(a-0.45),y2-h*Math.sin(a-0.45),x2-h*Math.cos(a+0.45),y2-h*Math.sin(a+0.45)],s)},
 tag(t,x,y,tx,ty,a){const hl=typeof GHL==='function'&&GHL(t);const gon=typeof GD!=='undefined'&&GD.on&&GD._hlPrev;if(hl){GD._hlNow=true;const pr=(performance.now()/600)%1;g.circ(x,y,10+pr*22,null,'rgba(240,138,69,'+(1-pr)+')',3);ctx.font='700 15px "Source Sans 3",system-ui,sans-serif';const w=ctx.measureText(t).width,bx=a==='right'?tx-8-w:tx;g.line([x,y,tx,ty],C.accent,2.5);g.circ(x,y,6,C.accent);g.rect(bx-2,ty-13,w+16,26,C.accent,null,0,7);g.text(t,bx+6,ty,{s:15,c:'#fff',w:700});return}if(gon)ctx.globalAlpha=0.35;g.line([x,y,tx,ty],C.muted,1.2,[3,3]);g.circ(x,y,3,C.muted);g.text(t,tx+(a==='right'?-4:4),ty,{a:a||'left',s:13,c:C.ink,w:600});ctx.globalAlpha=1},
 readout(label,val,x=600,y=18,w=184){g.rect(x,y,w,52,C.panel,C.line,1.5,8);g.text(label,x+10,y+15,{s:11,f:'m',c:C.muted});g.text(val,x+10,y+36,{s:19,f:'m',c:C.ink,w:600})},
 readout2(items,x=600,y=18,w=184){const h=18+items.length*20;g.rect(x,y,w,h,C.panel,C.line,1.5,8);items.forEach((it,i)=>{g.text(it[0],x+10,y+18+i*20,{s:12,f:'m',c:C.muted});g.text(it[1],x+w-10,y+18+i*20,{s:14,f:'m',c:it[2]||C.ink,w:600,a:'right'})})},

/* ===== helpers de presión (prefijo pr) ===== */
// Gas molecular: N moléculas que rebotan dentro de inside(x,y); frac = fracción activa (∝ presión absoluta: P = n·k·T, T constante → misma velocidad, más densidad).
// Los choques contra la pared (hit) se marcan con un destello: su frecuencia crece con la presión.
function prGas(s,key,o){const st=s.st,G=st[key]||(st[key]={P:[],H:[],lt:s.t});const dt=clamp(s.t-G.lt,0,0.05);G.lt=s.t;

 const spawn=p=>{for(let k=0;k<40;k++){p.x=lerp(b[0],b[2],Math.random());p.y=lerp(b[1],b[3],Math.random());if(ins(p.x,p.y))return true}return false};
 while(G.P.length<N){const a=Math.random()*6.283,m=sp0*(0.55+0.9*Math.random());const p={vx:Math.cos(a)*m,vy:Math.sin(a)*m,x:0,y:0};p.ok=spawn(p);G.P.push(p)}
 const sub=3,h=dt/sub;
 for(let i=0;i<n;i++){const p=G.P[i];if(!p.ok||!ins(p.x,p.y)){p.ok=spawn(p);if(!p.ok)continue}
  for(let k=0;k<sub;k++){let nx=p.x+p.vx*h,ny=p.y+p.vy*h;if(!ins(nx,ny)){
    if(ins(p.x-p.vx*h,ny))p.vx=-p.vx;else if(ins(nx,p.y-p.vy*h))p.vy=-p.vy;else{p.vx=-p.vx;p.vy=-p.vy}
    const a=Math.atan2(p.vy,p.vx)+(Math.random()-0.5)*0.5,m=Math.hypot(p.vx,p.vy);p.vx=Math.cos(a)*m;p.vy=Math.sin(a)*m;
    if((!o.hit||o.hit(nx,ny))&&G.H.length<70)G.H.push({x:nx,y:ny,t:s.t});
    nx=p.x+p.vx*h;ny=p.y+p.vy*h;if(!ins(nx,ny)){nx=p.x;ny=p.y}}
   p.x=nx;p.y=ny}
  const tl=o.tail??0.03,tx=p.x-p.vx*tl,ty=p.y-p.vy*tl;ins(tx,ty)?streak(tx,ty,p.x,p.y,r,col):g.circ(p.x,p.y,r,col)}
 G.H=G.H.filter(q=>s.t-q.t<0.3);for(const q of G.H){const u=(s.t-q.t)/0.3;ctx.globalAlpha=(1-u)*0.85;g.circ(q.x,q.y,1.5+u*hr,null,o.hcol||C.warn,1.6);ctx.globalAlpha=1}

// Columna de líquido con menisco cóncavo (agua): y = nivel medio, dep = profundidad del menisco
function prMen(x0,x1,y,yb,dep,col){const p=[];for(let i=0;i<=16;i++){const u=i/16;p.push(x0+(x1-x0)*u,y+dep*(0.5-(2*u-1)*(2*u-1)))}const top=p.slice();p.push(x1,yb,x0,yb);g.poly(p,col);g.line(top,C.fluidD,2)}
// Respuesta de 2.º orden (inercia del líquido: oscila un poco antes de asentarse)
function prOsc(s,k,tg,w,z){const G=s.st[k]||(s.st[k]={x:tg,u:0,lt:s.t});const dt=clamp(s.t-G.lt,0,0.05);G.lt=s.t;const n=Math.max(1,Math.ceil(dt/0.01)),h=dt/n;for(let i=0;i<n;i++){G.u+=(w*w*(tg-G.x)-2*z*w*G.u)*h;G.x+=G.u*h}return G.x}

function prCh(p,w,col){g.line(p,C.panel,w);g.line(p,col||C.fluidL,w)}

const STEPS3D={"Q":{"0":["Las partículas se vuelven rojas en el orificio: ahí la velocidad es máxima.","La columna P₂ baja: más velocidad significa menos presión (Bernoulli).","La sección mínima del chorro, la vena contracta, está un poco aguas abajo de la placa, no en ella.","Aguas abajo la presión se recupera solo en parte: P₃ queda por debajo de P₁. Esa es la pérdida de carga permanente, grande en la placa.","Si duplicas el caudal, ΔP se multiplica por 4: Q ∝ √ΔP."],"1":["En la garganta las partículas van más rápidas (rojas): continuidad, misma masa por menos sección.","La columna de la garganta baja respecto a la de entrada: esa ΔP da el caudal.","La salida divergente es larga y suave: la presión se recupera casi por completo (P₃ ≈ P₁).","Por su forma no retiene sólidos y se puede recubrir por dentro: sirve para corrosivos y fluidos con partículas."],"2":["Dentro de la tubería hay una boquilla con la entrada redondeada y perfilada.","No tiene salida divergente: el fluido sale como un chorro rápido (rojo).","Se mide ΔP entre antes de la tobera y la salida del chorro: Q ∝ √ΔP.","Aguanta gases a alta velocidad (gas natural) y fluidos con partículas."],"3":["Fíjate en el perfil: el fluido va más rápido en el centro que cerca de las paredes.","La boca del tubo en L mira contra el flujo: ahí el fluido se frena y aparece la presión total.","La toma de la pared solo nota la presión estática.","La columna de presión total queda más alta; la diferencia crece con v².","Mide la velocidad en un solo punto (el de máxima velocidad)."],"4":["El perfil no es plano: cada toma ve una velocidad distinta.","Las 4 tomas frontales comunican con una cámara interior que promedia las presiones.","La toma de presión estática está detrás de la sonda, mirando aguas abajo.","Por eso va bien en conductos grandes, donde un solo punto (Pitot) no sería representativo."],"5":["El fluido entra por abajo y empuja el flotador hacia arriba.","Al subir, el tubo es más ancho y el hueco anular crece.","El flotador se para donde el empuje iguala a su peso: ΔP constante, área variable.","Más caudal → más arriba. Se lee directamente en la escala del vidrio."],"6":["El rotor gira más rápido cuanto más caudal pasa.","Cada vez que una paleta pasa bajo el captador se emite un pulso (el LED parpadea).","Caudal = frecuencia de pulsos / K.","Necesita líquidos limpios: las paletas se dañan con sólidos."],"7":["Mira el paquete de líquido (en naranja) que queda atrapado entre cada rueda y la carcasa.","Ese volumen es fijo y conocido: la cámara calibrada.","Cada vuelta completa transporta 4 paquetes; el contador multiplica vueltas por volumen.","Es muy preciso con líquidos viscosos (aceites)."],"8":["Las líneas amarillas son el campo B, de la bobina de arriba a la de abajo.","El flujo va a lo largo de la tubería, perpendicular a B.","Las cargas + (rojas) se van hacia un electrodo y las − (azules) hacia el otro.","Más velocidad, más separación de cargas, más tensión.","Sin piezas móviles y sin obstruir; solo líquidos conductores."],"9":["Una placa cuelga en el centro de la tubería, enfrentada al flujo.","El fluido la empuja (flecha naranja) y la placa se desplaza.","El desplazamiento es proporcional al caudal y se lee fuera.","Admite fluidos sucios o con partículas: pulpas, leche cruda, zumos."],"10":["Vista desde arriba: los torbellinos se desprenden alternando un lado y otro.","Uno gira en sentido horario y el siguiente en sentido antihorario.","Cada torbellino que pasa por el sensor da un pulso de presión (el LED parpadea).","Frecuencia ∝ velocidad ∝ caudal. Sirve para líquidos, gases y vapor."],"11":["Dos transductores, uno aguas arriba y otro aguas abajo, en diagonal.","El pulso que va a favor del flujo llega antes (t₁).","El que va en contra llega después (t₂).","Δt = t₂ − t₁ es proporcional a la velocidad. Sin contacto con el fluido."],"12":["El agua corre por un canal abierto, sin tubería llena.","Un vertedero (placa con escotadura) la obliga a subir antes de rebosar.","Cuanto más caudal, más alto queda el agua aguas arriba (h).","Un medidor de nivel aguas arriba mide h, y Q ∝ h^1,5. Hacen falta tramos rectos de unos 10 anchos de canal."],"13":["Un calefactor da un calor constante en el centro del tubo.","Sin caudal, el calor se reparte igual a los dos lados: T₁ ≈ T₂.","Con caudal, el gas arrastra el calor aguas abajo: T₂ sube y T₁ baja.","La diferencia T₂ − T₁ depende del caudal másico."],"14":["Sin caudal (deslizador a 0), las dos ramas de cada tubo se mueven a la vez.","Sube el caudal: la rama de entrada va retrasada y la de salida adelantada, y el tubo se retuerce.","Los detectores (naranjas) miden ese desfase en tiempo.","Desfase ∝ caudal másico: medida directa de masa, sin depender de la densidad."]},"P":{"0":["Las dos ramas están llenas de líquido hasta la misma altura si no hay diferencia de presión.","Al aplicar presión en la rama izquierda, el líquido baja ahí y sube en la derecha.","La diferencia de alturas h equilibra la presión: P = ρ·g·h.","Es medida directa por equilibrio, para presiones pequeñas."],"1":["La presión empuja el líquido del depósito, que baja muy poco.","El líquido sube por la rama inclinada un ángulo α.","Para la misma altura vertical h, recorre una longitud mucho mayor: L = h / sen α.","Por eso es más sensible que el tubo en U para presiones pequeñas."],"2":["La presión entra por el extremo fijo (abajo).","Mira la sección elíptica ampliada: con presión se hace más redonda.","Por eso el tubo se abre (se endereza) y su extremo libre se mueve.","La biela transmite el movimiento al sector dentado, que gira el piñón y la aguja.","Simple 0–1800, espiral 0–2500, hélice 0–5000 kg/cm²: más vueltas, más rango."],"3":["La presión entra por abajo y hincha el fuelle.","Las ondas del acordeón se abren y el fuelle se alarga.","El resorte de arriba se comprime y frena el movimiento.","El brazo marca el desplazamiento en la escala.","Es muy sensible: presiones bajas y vacío (altímetros)."],"4":["La cápsula son dos discos corrugados soldados por el borde.","El fluido de proceso entra por abajo y empuja el disco superior.","El centro del diafragma se abomba y empuja la varilla.","La varilla mueve la aguja. Separa el fluido del mecanismo: ideal para corrosivos y viscosos."],"5":["La presión llega por debajo de la membrana y la abomba.","La rejilla de la galga, pegada encima, se estira con ella.","Hilo más largo y más fino → su resistencia aumenta.","El puente de Wheatstone convierte ese cambio de R en señal."],"6":["El émbolo comprime el cristal cuando cambia la presión.","Al deformarse, el cristal genera carga: + arriba y − abajo.","Si la presión se queda constante, la carga se pierde y la señal cae a 0.","Prueba: mueve el deslizador y déjalo quieto. Solo mide presión dinámica."],"7":["La presión entra por la izquierda y empuja el diafragma central.","El hueco con la placa derecha se estrecha: C₂ aumenta.","El hueco con la placa izquierda se ensancha: C₁ disminuye.","Las líneas de campo se concentran donde el hueco es menor."]},"T":{"0":["Calienta el líquido del vaso con el deslizador.","El mercurio del depósito (bulbo) se dilata.","Como el capilar es muy fino, un pequeño aumento de volumen hace subir mucho la columna.","La altura de la columna en la escala da la temperatura."],"1":["El bulbo está sumergido en el fluido cuya temperatura queremos medir.","Su fluido interior se dilata con la temperatura.","La expansión viaja por el capilar hasta un tubo Bourdon dentro del dial.","El Bourdon se deforma y mueve la aguja (o abre un contacto)."],"2":["Cobre (dilata más) y acero (dilata menos) están soldados a lo largo.","Al subir la temperatura, el lado de cobre se alarga más y la lámina se curva.","El extremo libre se desplaza en proporción a la temperatura.","Sin electricidad: apto para ambientes explosivos."],"3":["Dentro de la vaina hay un hilo de platino enrollado (Pt100).","Al subir la temperatura, la resistencia del hilo aumenta (100 Ω a 0 °C).","La RTD es una rama del puente de Wheatstone: si R cambia, el puente se desequilibra.","El galvanómetro del centro marca ese desequilibrio, que se traduce en temperatura."],"4":["La perla marrón del extremo es un semiconductor dopado.","Al subir la temperatura, su resistencia baja (al revés que la RTD).","La barra de la derecha es R: mira cómo se encoge al calentar.","Solo trabaja entre 0 y 40 °C, pero es el más sensible y el más pequeño."],"5":["La unión de medida está en la llama; la de referencia, en hielo a 0 °C.","La diferencia de temperaturas entre ambas uniones genera una f.e.m. de unos pocos mV.","Los electrones (puntos amarillos) circulan más rápido cuanto mayor es ΔT.","Como la referencia está a 0 °C, el voltímetro da directamente la temperatura de la unión caliente."],"6":["El bloque caliente emite radiación; su color cambia con la temperatura.","La lente del pirómetro recoge la radiación dentro de su ángulo de visión (cono).","La concentra sobre el detector, que da una señal proporcional a T⁴ (Stefan-Boltzmann).","Mide sin contacto: piezas en movimiento, hornos, zonas peligrosas."],"7":["En el ocular ves a la vez el objeto caliente y el filamento de una lámpara calibrada.","Si el filamento se ve más oscuro o más brillante que el fondo, se ajusta la corriente de la lámpara.","Cuando el filamento desaparece (mismo brillo), esa corriente indica la temperatura.","Se usa para cuerpos metálicos."],"8":["La emisividad del objeto cambia sola (por ejemplo, porque se oxida la superficie).","La radiación se divide en dos haces con filtros de 0,6 µm y 0,9 µm.","Las dos barras suben y bajan con la emisividad…","…pero su cociente no cambia: solo depende de la temperatura."],"9":["Un emisor envía un pulso de ultrasonido a través del gas.","La velocidad del sonido en el gas aumenta con la temperatura.","Cuanto más caliente, antes llega el pulso al receptor.","El tiempo de tránsito da la temperatura."],"10":["El cristal de cuarzo oscila a su frecuencia de resonancia.","Esa frecuencia cambia ligeramente con la temperatura.","Midiendo la frecuencia (la onda) se obtiene la temperatura."]},"L":{"0":["La regleta graduada baja por la boca del depósito hasta tocar el fondo.","Se saca y se mira hasta dónde está mojada.","La longitud mojada es el nivel. Es el método directo más simple.","Típico en depósitos de combustible y cisternas enterradas."],"1":["Un tubo transparente está unido al tanque por arriba y por abajo.","Por vasos comunicantes, el líquido del tubo queda a la misma altura que dentro.","Basta con mirar el tubo para leer el nivel."],"2":["Es un tubular reforzado para calderas: vidrio grueso de borosilicato.","Una armadura de acero con tornillos lo protege de roturas.","El nivel de agua se ve por la ranura del vidrio.","Es el indicador de seguridad del nivel de agua en calderas."],"3":["El flotador hueco sube y baja con la superficie del líquido.","Un cable pasa por dos poleas y lleva un índice por fuera del tanque.","Cuando el flotador sube, el índice baja: la escala está invertida.","Los contactos de alto y bajo nivel encienden las alarmas."],"4":["El desplazador no sube ni baja: queda fijo y más o menos sumergido.","Al subir el nivel crece la parte sumergida y el empuje (flechas naranjas).","El empuje descarga el brazo y el tubo de torsión gira.","Una varilla lleva el giro a un indicador o transmisor fuera del tanque."],"5":["La presión del gas cambia sola (mira el valor): sube y baja.","La presión del fondo cambia con ella, pero la de arriba también.","El transmisor resta: ΔP solo depende de la altura de líquido.","Por eso se usa en tanques presurizados (calderas)."],"6":["El aire entra por arriba a través del rotámetro, que fija un caudal pequeño.","Sale en burbujas por el extremo inferior del tubo.","La presión del aire en el tubo es igual a la de la columna de líquido (ρ·g·h).","Más nivel → más presión → el manómetro sube.","Solo el tubo toca el líquido: bueno para residuales y corrosivos."],"7":["Un manómetro está conectado al fondo del tanque.","Mide la presión de la columna de líquido entre la superficie y su eje.","En un tanque abierto, P = ρ·g·H: la aguja sigue al nivel."],"8":["En la pared, abajo, hay una cámara con un diafragma en contacto con el líquido.","La presión de la columna empuja el diafragma y lo deforma.","La deformación, transmitida a un manómetro sellado, da el nivel."],"9":["Tres electrodos de distinta longitud: común (el más largo), bajo y alto.","Cuando el líquido toca un electrodo, cierra el circuito con el común y el relé se activa.","Así se detectan los niveles alto y bajo (función de detector).","El líquido y el tanque deben ser conductores."],"10":["La sonda central y la pared metálica del tanque forman un condensador.","El líquido (aceite) entre ambos cambia el dieléctrico.","Donde hay líquido, el campo (puntos amarillos) es más intenso.","La capacidad crece linealmente con el nivel. Sirve para no conductores."],"11":["El emisor-receptor está arriba, sin tocar el líquido.","Envía un pulso (unos 20 kHz) hacia la superficie.","El eco vuelve: el tiempo de ida y vuelta da la distancia d.","Nivel = altura del tanque − d. También vale para sólidos."],"12":["Los rayos salen de la fuente (izquierda) hacia el detector (derecha).","Los que atraviesan zona con gas llegan al detector.","Los que atraviesan el líquido se absorben y no llegan.","Más nivel → menos cuentas. No hay contacto ni perforación del tanque."],"13":["Un cono cuelga de una varilla dentro del silo.","Cuando el sólido llega al cono, lo empuja hacia arriba.","La varilla acciona un microinterruptor en una caja estanca al polvo.","Es un detector de nivel puntual (alto o bajo), por ejemplo de harina."],"14":["Una varilla de acero entra por la pared del silo.","Cuando el sólido la cubre, la empuja y la flexiona.","La varilla presiona un diafragma de latón con un interruptor.","Detector puntual de nivel."],"15":["Un motor hace girar lentamente unas paletas dentro del silo.","Mientras no hay sólido, giran libres.","Cuando el sólido las cubre, las frena y el motor se bloquea.","El bloqueo activa dos interruptores: corta la alimentación y da la alarma."],"16":["Un diafragma está montado en la pared del silo.","Cuando el sólido lo alcanza, su peso lo empuja hacia fuera.","La deformación acciona un interruptor: detector puntual."],"17":["Un emisor y un receptor de microondas a los lados de un conducto.","Si cae sólido en movimiento, refleja las microondas con un cambio de frecuencia (efecto Doppler).","El receptor detecta ese cambio: hay flujo de sólido.","Sin flujo, no hay señal. No toca el material: bueno para abrasivos y polvo."],"18":["Un motor baja un peso colgado de un cable dentro del silo.","Cuando el peso choca con el sólido, el cable se afloja.","En ese momento se invierte el motor y el peso sube.","El punto de inversión queda registrado: es el nivel. Mide en continuo en silos muy altos."],"19":["La tolva descansa sobre una plataforma de carga.","La báscula pesa el conjunto tolva + sólido.","Restando el peso de la tolva (tara) se obtiene el peso del sólido.","Con la densidad del sólido, el peso da el nivel. Medida en continuo."]},"V":{"0":["El fluido entra por la cámara de abajo y tiene que subir por el asiento (anillo) para salir.","El obturador sube y baja sobre el asiento movido por el vástago y el actuador.","Más apertura → más área de paso → más caudal. Permite un control muy fino.","El recorrido en S frena mucho el fluido: pérdida de carga alta. Asiento doble = menos fuerza en el actuador."],"1":["El obturador es un cilindro que se desliza dentro de una jaula con ventanas.","Al subir va destapando filas de ventanas, empezando por abajo.","El fluido entra por las ventanas en muchos chorros pequeños que chocan entre sí en el centro.","Así la caída de presión se reparte: menos cavitación y menos ruido."],"2":["Un disco gira sobre un eje vertical en el centro de la tubería.","Cerrada: el disco atraviesa el paso. Abierta: queda de canto al flujo.","De cerrada a abierta basta 1/4 de vuelta (90°).","El cierre no es totalmente estanco y frena menos que una de globo."],"3":["El obturador es una bola con un orificio que la atraviesa.","Gira 1/4 de vuelta con la palanca: orificio alineado = abierta.","Atravesada, la bola tapa por completo: cierre hermético.","Abierta casi no frena el fluido; se usa sobre todo en todo o nada."],"4":["Una placa (compuerta) baja en perpendicular al flujo y lo corta.","Se maneja con un volante y un vástago roscado.","Totalmente abierta deja el paso libre: pérdida de carga muy baja.","Es de aislamiento: abierta o cerrada. A medias el chorro la erosiona y vibra."],"5":["Encima del cuerpo hay una bobina (solenoide) con un núcleo de hierro móvil.","Sin señal, un muelle empuja el núcleo hacia abajo y tapa el orificio: cerrada.","Con señal, la bobina crea un campo magnético que levanta el núcleo: abre del todo.","No hay término medio: es todo o nada. Un grano en el asiento impide el cierre."],"6":["Dentro hay una clapeta colgada de una bisagra sobre un asiento.","Si el fluido va en el sentido correcto, él mismo empuja y abre la clapeta.","Si intenta volver, la presión la aprieta contra el asiento y cierra.","No necesita actuador ni señal: evita que la tubería se vacíe."],"7":["El cuerpo tiene un vertedero (un lomo) en el fondo.","Un diafragma flexible, empujado por un compresor, baja hasta apoyarse en el vertedero y corta el paso.","El lodo solo toca el cuerpo y el diafragma: sella muy bien y aguanta corrosivos y abrasivos.","El diafragma es de goma: no sirve para altas presiones ni temperaturas."],"8":["El obturador es un casquete esférico montado en un brazo.","El eje de giro está desplazado del centro de la tubería (excéntrico).","Al girar, el casquete se separa del asiento rodando hacia atrás, sin rozarlo.","Por eso aguanta lodos muy erosivos con alta presión y temperatura."],"9":["Arriba, una tolva llena de sólido a granel (granos, polvo, pellets).","Un rotor con alveolos gira dentro de un cilindro: cada alveolo se llena al pasar bajo la tolva.","Abajo el alveolo se vacía en la descarga.","El caudal se regula con la velocidad del rotor. No vale para líquidos."],"10":["El controlador envía 4–20 mA al posicionador neumático (caja lateral).","El posicionador manda aire (3–15 psi) a la cámara bajo el diafragma.","El aire empuja el diafragma contra el resorte y el vástago sube el obturador.","Fuerza baja y poco recorrido, pero preciso y barato: el preferido en válvulas de control."],"11":["Un pistón se mueve dentro de un cilindro y está unido al vástago de la válvula.","El aire entra a más presión que en el de diafragma: hasta 12 bar.","Por eso da más fuerza y más recorrido.","Responde rápido; se usa en válvulas todo o nada y de control."],"12":["Un motor eléctrico (AC o DC) gira mientras la posición real no alcanza la pedida.","La reductora de engranajes baja la velocidad y aumenta el par.","El eje de salida gira la válvula (aquí una de bola) o la mueve en lineal.","Todo o nada o proporcional. En ambiente explosivo necesita carcasa de protección."],"13":["Una bomba aspira aceite del depósito y lo manda a presión al cilindro.","El aceite a presión empuja el pistón: la energía del fluido se convierte en movimiento.","Como el aceite casi no se comprime, responde rápido.","Da la fuerza MÁS ALTA de todos los actuadores."],"14":["La línea naranja de arriba es la presión a lo largo de la tubería; la roja discontinua, la presión de vapor Pv.","En la vena contracta (justo después del estrechamiento) la presión es mínima.","Si baja de Pv salen burbujas de vapor. Si luego la presión vuelve a subir por encima de Pv, las burbujas revientan (destellos): CAVITACIÓN.","Si aguas abajo la presión sigue por debajo de Pv, el vapor continúa: FLASHING."],"15":["Dos válvulas iguales con la misma apertura x y la misma ΔP, pero distinto obturador.","Arriba, obturador lineal: f(x) = x (curva verde).","Abajo, obturador isoporcentual: f(x) = R^(x−1) (curva naranja). Con poca apertura deja pasar muy poco.","Esto es la característica INHERENTE (ΔP constante). Instalada en el proceso (ΔP variable) se aparta de ella."]}};
const GROUPS=[{k:'T',n:'Temperatura',v:'Temperatura',d:TEMP},{k:'P',n:'Presión',v:'Presión',d:PRES},{k:'Q',n:'Caudal',v:'Caudal',d:CAUD},{k:'L',n:'Nivel',v:'Nivel',d:NIVEL},{k:'V',n:'Válvulas y actuadores',v:'Apertura',d:VALV}];

function curApp(D){return D.apps?D.apps[Math.min(appIdx,D.apps.length-1)]:D.app}

 const as=$('appsel');if(A&&D.apps&&D.apps.length>1){as.hidden=false;as.innerHTML='<span class="ak">Aplicaciones:</span>'+D.apps.map((a,i)=>`<button class="ach" aria-pressed="${i===appIdx}" data-i="${i}">${i+1}. ${a.t}</button>`).join('');as.querySelectorAll('.ach').forEach(b=>b.onclick=()=>{appIdx=+b.dataset.i;S.st={};sel()})}else as.hidden=true;
 try{history.replaceState(null,'','#'+G.k+di)}catch(e){}if(typeof GD!=='undefined'&&GD.on){clearTimeout(GD.tm);setTimeout(gStart,30)}}

function step(d){const G=GROUPS[gi];di+=d;if(di<0){gi=(gi+GROUPS.length-1)%GROUPS.length;di=GROUPS[gi].d.length-1}else if(di>=G.d.length){gi=(gi+1)%GROUPS.length;di=0}sel()}

 GD.sweep=/(proporcional|cuanto mas|cuanto mayor|depende|varia|al variar|mueve el deslizador)/.test(n);clearTimeout(GD.tm);GD.dur=4+s.length*0.05;GD.t0=performance.now();if(GD.play)GD.tm=setTimeout(()=>gGo(1),GD.dur*1000)}
